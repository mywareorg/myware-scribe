[package]
name = "hippo-transcribe-gui"
version = "1.0.0"
edition = "2021"
description = "Private, offline speaker diarization and transcription."
license = "LGPL-2.1-only"
repository = "https://gitlab.com/librewarelive/hippo-transcribe"

[features]
default = []
# Forward the accelerator flags to the core crate. The GUI is the workspace's
# default member, so a bare `--features gpu` resolves against this package;
# without these the flag fails with "does not contain this feature".
gpu = ["hippo-transcribe-core/gpu"]
coreml = ["hippo-transcribe-core/coreml"]

[dependencies]
hippo-briefing = { path = "../briefing" }
hippo-transcribe-core = { path = "../core" }
# Shared design tokens and UI vocabulary. During co-development this is a path
# dependency; it becomes a pinned git dependency once the API settles.
hippo-ui = { path = "../../myware-ui/crates/hippo-ui", features = ["serde"] }
iced = { version = "0.13", features = ["tokio", "advanced", "canvas", "image-without-codecs"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
rodio = "0.21"
time = { version = "0.3", features = ["local-offset"] }
notify-rust = "4"
wsola = "0.3"

[target.'cfg(windows)'.dependencies]
# WinRT, for the Store purchase client (durable Pro add-on).
windows-collections = "0.3"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Services_Store",
    "Win32_Foundation",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[[bin]]
name = "hippo-transcribe"
path = "src/main.rs"

