[package]
name = "transiel-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
transiel-core = { path = "../core" }
iced = { version = "0.13", features = ["tokio", "advanced", "canvas"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = "0.20"
notify-rust = "4"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
