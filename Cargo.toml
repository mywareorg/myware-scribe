[workspace]
resolver = "2"
members = ["briefing", "core", "gui", "summarizer", "ui-kit"]
default-members = ["gui"]

[profile.release]
lto = true
codegen-units = 1

# WSOLA is used on the real-time audio thread. Keep it optimized even in
# debug builds so playback does not underrun while the rest of the GUI is
# unoptimized.
[profile.dev.package.wsola]
opt-level = 3

# Iteration profile: no LTO and parallel codegen for fast rebuilds. Use
# `cargo run --profile release-fast` while developing.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
