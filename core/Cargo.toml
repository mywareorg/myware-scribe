[package]
name = "myware-scribe-core"
version = "1.0.0"
edition = "2021"
description = "Private, offline speaker diarization and transcription."
license = "LGPL-2.1-only"
repository = "https://gitlab.com/mywareorg/myware-scribe"

[features]
default = []
# Vulkan + OpenMP acceleration for Windows/Linux. The Vulkan backend needs the
# Vulkan SDK at build time, so it is opt-in (Windows release builds enable it).
gpu = ["whisper-rs/vulkan", "whisper-rs/openmp"]
# Core ML encoder offload on macOS. Requires a converted `*-encoder.mlmodelc`
# beside each model; without one whisper falls back to Metal.
coreml = ["whisper-rs/coreml"]
# The always-Pro edition: the tier is compiled in instead of coming from a
# Store receipt, so the binary works as Pro without a store or an entitlement.
# Used for the direct-download build; the Store package does not enable it.
# See `license::UNLOCKED`.
pro = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
symphonia = { version = "0.5", features = ["all"] }
symphonia-adapter-libopus = "0.2.9"
rubato = "0.15"
whisper-rs = "0.16"
num_cpus = "1"
ureq = "2"
uuid = { version = "1", features = ["v4"] }

# Windows loads the sherpa-onnx C API from a DLL shipped beside the executable,
# so no native library is linked into the binary. Other platforms keep the
# static source build.
# Metal is always on for macOS builds: it needs only the Xcode command line
# tools, and it is the main Apple Silicon speedup.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"

[target.'cfg(not(windows))'.dependencies]
sherpa-rs-sys = { version = "0.6.8", default-features = false, features = ["static"] }
