[package]
name = "transiel-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["static", "sys"] }
whisper-rs = "0.16"
num_cpus = "1"
rayon = "1"
