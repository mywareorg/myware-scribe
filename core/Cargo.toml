[package]
name = "transiel-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"
whisper-rs = "0.16"
num_cpus = "1"
ureq = "2"

# Windows loads the sherpa-onnx C API from a DLL shipped beside the executable,
# so no native library is linked into the binary. Other platforms keep the
# static source build.
[target.'cfg(windows)'.dependencies]
libloading = "0.8"

[target.'cfg(not(windows))'.dependencies]
sherpa-rs-sys = { version = "0.6.8", default-features = false, features = ["static"] }
