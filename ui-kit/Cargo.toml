[package]
name = "ui-kit"
version = "1.0.0"
edition = "2021"
description = "Iced UI primitives: palette, styles, buttons, menus and dialogs."
license = "LGPL-2.1-only"
repository = "https://gitlab.com/librewarelive/hippo-transcribe"

[lib]
name = "ui_kit"

[dependencies]
# The same iced the app is built against. No renderer feature: this is a library
# of widget builders, and the application chooses its own renderer.
iced = { version = "0.13", default-features = false, features = ["advanced"] }
