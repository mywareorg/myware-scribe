# Pipelines are off until we decide otherwise. Nothing runs on push, merge
# request, tag or schedule. To start one deliberately: CI/CD > Pipelines >
# Run pipeline, and add CI_ENABLED=1 as a variable.
#
# The jobs below are kept, not deleted, so the work is not lost. Re-enabling is
# the variable, not a rewrite. When that day comes, add `changes:` so docs and
# artwork commits stop triggering a Windows build, and a `resource_group` so a
# superseded commit cancels instead of finishing.
workflow:
  rules:
    - if: $CI_ENABLED == "1"
    - when: never

stages: [build]

windows-build:
  stage: build
  tags: [windows]
  interruptible: true
  rules:
    # A push to the work branch costs nothing; the merge request is the gate.
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # gui/Cargo.toml depends on ../../myware-ui by path, and a checkout has no
    # sibling, so the workspace manifest cannot resolve without this.
    - git clone --depth 1 https://gitlab.com/mywareorg/myware-ui.git ../myware-ui
    - powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/build-windows.ps1 -SkipTests
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - dist/*.zip
      - dist/*.sha256
      - build-windows.log

# Publish every pinned model to the Generic Package Registry.
#
# GitLab does not count the package registry against the repository/LFS quota,
# so the large files never enter git history. The resulting URL is:
#   $CI_API_V4_URL/projects/$MODELS_PROJECT_ID/packages/generic/hippo-models/<version>/<file>
#
# Set MODELS_PROJECT_ID to the project that serves the URLs in
# models.lock.json (not this app project) and MODELS_UPLOAD_TOKEN (a project,
# group or personal access token with `api` scope, masked). The package project
# must be public if the app downloads it without credentials; otherwise point
# MYWARE_SCRIBE_MODEL_MIRROR at a public mirror instead.
publish-models:
  stage: build
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    MODELS_PACKAGE_VERSION: "1.0.0"
  script:
    - test -n "$MODELS_UPLOAD_TOKEN" || { echo "MODELS_UPLOAD_TOKEN is not set"; exit 1; }
    - test -n "$MODELS_PROJECT_ID" || { echo "MODELS_PROJECT_ID is not set"; exit 1; }
    - scripts/fetch-models.sh --all
    - |
      project_id="$MODELS_PROJECT_ID"
      files=$(find vendor/models -type f ! -name '*.part')
      if [ -z "$files" ]; then
        echo "no model files staged under vendor/models" >&2
        exit 1
      fi
      status=0
      for file in $files; do
        name=$(basename "$file")
        url="$CI_API_V4_URL/projects/$project_id/packages/generic/hippo-models/$MODELS_PACKAGE_VERSION/$name"
        code=$(curl -s -o /dev/null -w '%{http_code}' \
          --header "PRIVATE-TOKEN: $MODELS_UPLOAD_TOKEN" "$url")
        if [ "$code" = "200" ]; then
          echo "exists: $name"
          continue
        fi
        echo "uploading $name ($(wc -c < "$file") bytes)"
        curl --fail --show-error --upload-file "$file" \
          --header "PRIVATE-TOKEN: $MODELS_UPLOAD_TOKEN" "$url"
        code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url")
        if [ "$code" != "200" ]; then
          echo "verify failed for $name: HTTP $code" >&2
          status=1
        else
          echo "verified: $name"
        fi
      done
      exit $status

# The briefing model is 1.1 GB and the interactive upload path rejects bodies
# that size before GitLab stores them; the accuracy model (547 MiB) only ever
# uploaded from a runner. Do the same here, with the hash checked first.
#
# Manual, because it moves a gigabyte over the network. Set MODELS_UPLOAD_TOKEN
# (masked, `api` scope) and, if the models project is separate,
# MODELS_PROJECT_ID.
publish-briefing-model:
  stage: build
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    MODELS_PACKAGE_VERSION: "1.0.0"
    BRIEFING_MODEL: qwen2.5-1.5b-instruct-q4_k_m.gguf
    BRIEFING_SHA256: "6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e"
    BRIEFING_URL: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/91cad51170dc346986eccefdc2dd33a9da36ead9/qwen2.5-1.5b-instruct-q4_k_m.gguf"
  script:
    - test -n "$MODELS_UPLOAD_TOKEN" || { echo "MODELS_UPLOAD_TOKEN is not set"; exit 1; }
    - test -n "$MODELS_PROJECT_ID" || { echo "MODELS_PROJECT_ID is not set"; exit 1; }
    - |
      project_id="$MODELS_PROJECT_ID"
      url="$CI_API_V4_URL/projects/$project_id/packages/generic/hippo-models/$MODELS_PACKAGE_VERSION/$BRIEFING_MODEL"
      code=$(curl -s -o /dev/null -w '%{http_code}' \
        --header "PRIVATE-TOKEN: $MODELS_UPLOAD_TOKEN" "$url")
      if [ "$code" = "200" ]; then
        echo "already published: $BRIEFING_MODEL"
        exit 0
      fi
    - curl -L --fail --show-error --retry 3 -o "$BRIEFING_MODEL" "$BRIEFING_URL"
    - echo "$BRIEFING_SHA256  $BRIEFING_MODEL" | sha256sum -c -
    - |
      project_id="$MODELS_PROJECT_ID"
      url="$CI_API_V4_URL/projects/$project_id/packages/generic/hippo-models/$MODELS_PACKAGE_VERSION/$BRIEFING_MODEL"
      echo "uploading $BRIEFING_MODEL ($(wc -c < "$BRIEFING_MODEL") bytes)"
      curl --fail --show-error --upload-file "$BRIEFING_MODEL" \
        --header "PRIVATE-TOKEN: $MODELS_UPLOAD_TOKEN" "$url"
    - |
      project_id="$MODELS_PROJECT_ID"
      url="$CI_API_V4_URL/projects/$project_id/packages/generic/hippo-models/$MODELS_PACKAGE_VERSION/$BRIEFING_MODEL"
      echo "verify without credentials:"
      code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url")
      if [ "$code" != "200" ]; then
        echo "verify failed: HTTP $code $url" >&2
        exit 1
      fi
      echo "verified: $BRIEFING_MODEL"

# Serve PRIVACY.md as the Store listing's privacy policy URL.
#
# The wizard that created this file left a job with no script, which is why the
# pipeline failed. Pages only needs the rendered files in the published folder;
# there is nothing to build or install.
# The pages themselves are committed under public/, so publishing needs no
# shell utilities: a shell executor ignores `image:` and would run this in
# PowerShell, where printf/sed do not exist. Regenerate the HTML with
# scripts/make-privacy-page.py after editing PRIVACY.md.
pages:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - echo "publishing public/"
  artifacts:
    paths:
      - public
