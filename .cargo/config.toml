# sherpa-onnx static libraries are non-PIC, so the whole binary must be built
# non-PIE on Linux x86_64.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "relocation-model=dynamic-no-pic"]

# The prebuilt ONNX Runtime static library is built against the dynamic MSVC
# CRT (/MD). Keep Rust and the native libraries on the same runtime, and pass
# the Windows system libraries required by ONNX Runtime (ETW/registry) and
# PortAudio, which the static sherpa-onnx libraries do not carry.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "link-arg=advapi32.lib",
    "-C", "link-arg=ole32.lib",
    "-C", "link-arg=oleaut32.lib",
    "-C", "link-arg=uuid.lib",
    "-C", "link-arg=winmm.lib",
]
