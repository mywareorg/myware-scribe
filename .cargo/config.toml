# sherpa-onnx static libraries are non-PIC, so the whole binary must be built
# non-PIE on Linux x86_64.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "relocation-model=dynamic-no-pic"]

# Match the prebuilt sherpa-onnx/ONNX Runtime static libraries, which are
# built with the static MSVC CRT (/MT), and provide the Windows system
# libraries they need (ETW/registry) but do not carry themselves.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "link-arg=advapi32.lib",
    "-C", "link-arg=ole32.lib",
    "-C", "link-arg=oleaut32.lib",
    "-C", "link-arg=uuid.lib",
    "-C", "link-arg=winmm.lib",
]

# Fast edit/run loop: no LTO, parallel codegen, incremental.
[alias]
run-fast = "run --profile release-fast"
