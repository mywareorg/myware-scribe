# sherpa-onnx static libraries are non-PIC, so the whole binary must be built
# non-PIE on Linux x86_64.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "relocation-model=dynamic-no-pic"]

# Windows deliberately keeps the default DLL CRT. whisper-rs-sys compiles
# whisper.cpp and ggml through CMake, which links the DLL runtime; asking Rust
# for the static CRT as well leaves every CRT symbol those C++ objects import
# unresolved (LNK2019 __imp_*, then LNK1120). The runtime DLLs are staged beside
# the executable instead, so the bundle is still self-contained.

# Fast edit/run loop: no LTO, parallel codegen, incremental.
[alias]
run-fast = "run --profile release-fast"
# The GUI alone is not the whole app: the briefing worker has its own package
# outside the default members, and Summarize Transcript needs it beside the
# executable. Build both, then `cargo run-fast`.
build-fast = "build --profile release-fast -p myware-scribe-gui -p myware-summarize"
